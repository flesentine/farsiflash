<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1ea"><title>Farsi 2000</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#1c1b19;overflow:hidden;user-select:none}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(16px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}header{height:40px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#746f67}.tiny{border:0;background:none;color:inherit;padding:8px;text-decoration:none;cursor:pointer}.stage{width:min(88vw,480px);height:min(66dvh,590px);perspective:1200px;position:relative;touch-action:none}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .25s ease,opacity .16s;cursor:pointer}.card.flip{transform:rotateY(180deg)}.card.drag{transition:none}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px;border-radius:22px;background:#fff;border:1px solid #e8e3da;box-shadow:0 12px 42px #2a241912;backface-visibility:hidden;text-align:center}.back{transform:rotateY(180deg)}main{display:grid;place-items:center;min-height:0}.roman,.english{font-size:clamp(40px,10vw,66px);line-height:1.05;font-weight:700;letter-spacing:-.035em;overflow-wrap:anywhere}.farsi{margin-top:24px;font-family:Tahoma,"Geeza Pro",sans-serif;font-size:clamp(32px,8.4vw,54px);line-height:1.4;direction:rtl;color:#686159}.hint{position:absolute;top:24px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#aaa398}.mini{position:absolute;bottom:30px;left:28px;right:28px;color:#8a847a;font-size:16px;line-height:1.55}.speak{position:absolute;z-index:10;top:16px;right:16px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid #e7e1d7;background:#fff;color:#625d55;cursor:pointer}.speak svg{width:21px}.speak.playing{transform:scale(.94);background:#0000000d}.sw{position:absolute;top:50%;transform:translateY(-50%);z-index:20;pointer-events:none;opacity:0;font-size:12px;font-weight:800;letter-spacing:.11em;padding:8px 10px;border-radius:10px;background:#fffdd}.sw.left{right:18px;color:#a85e55}.sw.right{left:18px;color:#5d8065}.actions{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}.grade,.undo{border:0;background:none;color:#6e6961;min-height:52px;padding:0 14px;border-radius:14px;cursor:pointer}.again{text-align:left}.know{text-align:right}.undo{font-size:12px;opacity:0;pointer-events:none}.undo.show{opacity:1;pointer-events:auto}@media(hover:hover){.grade:hover,.undo.show:hover,.speak:hover,.tiny:hover{background:#00000009}}@media(prefers-reduced-motion:reduce){.card{transition:none}}@media(prefers-color-scheme:dark){body{background:#161614;color:#f4f1e9}.face{background:#252522;border-color:#34342f}.farsi{color:#c7c0b6}header,.grade,.undo,.tiny,.mini{color:#928c82}.speak{background:#2b2b27;border-color:#3a3933;color:#d1cbc0}.speak.playing{background:#ffffff12}.sw{background:#252522dd}}
</style></head><body><div class="app">
<header><div><span id="stageName">Start Here</span> · <span id="known">0</span> known · <span id="leftCount">2000</span> left</div><div><a class="tiny" href="https://en.wiktionary.org/wiki/Wiktionary:Frequency_lists/Persian/Miller_Aghajanian-Stewart_2009_(index)" target="_blank">source</a><button class="tiny" id="reset">reset</button></div></header>
<main><div class="stage" id="stage"><div class="sw left" id="left">AGAIN ←</div><div class="sw right" id="right">KNOW →</div><button class="speak" id="speak" title="Hear Persian (A)" aria-label="Hear Persian"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 3.5a5 5 0 0 1 0 7M18 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><div class="card" id="card" role="button" tabindex="0"><section class="face"><div class="hint">tap · ↑ ↓ to flip</div><div class="roman" id="roman"></div><div class="farsi" id="fa"></div></section><section class="face back"><div class="hint">meaning</div><div class="english" id="en"></div><div class="mini"><span id="mr"></span><br><span id="mf" dir="rtl"></span></div></section></div></div></main>
<div class="actions"><button class="grade again" id="again">← Again</button><button class="undo" id="undo">Undo</button><button class="grade know" id="knowBtn">Know →</button></div></div>
<script src="data/00.js"></script><script src="data/01.js"></script><script src="data/02.js"></script><script src="data/03.js"></script><script src="data/04.js"></script><script src="data/05.js"></script><script src="data/06.js"></script><script src="data/07.js"></script>
<script src="data/miller-00.js"></script><script src="data/miller-01.js"></script><script src="data/miller-02.js"></script><script src="data/miller-03.js"></script><script src="data/miller-04.js"></script><script src="data/miller-05.js"></script><script src="data/miller-06.js"></script><script src="data/miller-07.js"></script><script src="data/path.js"></script><script src="data/audio-manifest.js"></script>
<script>
const $=x=>document.getElementById(x),TOTAL=2000,KEY="farsi2000-v4",OLD=["farsi2000-v3","farsi2000-v2","farsi2000-v1"],OLD_D=(window.FARSI_CHUNKS||[]).flat(),RAW=(window.FARSI_MILLER_CHUNKS||[]).flat(),PATH=window.FARSI_PATH||[],AUDIO=window.FARSI_AUDIO||{};
const E={stage:$("stage"),stageName:$("stageName"),known:$("known"),leftCount:$("leftCount"),card:$("card"),roman:$("roman"),fa:$("fa"),en:$("en"),mr:$("mr"),mf:$("mf"),left:$("left"),right:$("right"),again:$("again"),know:$("knowBtn"),undo:$("undo"),speak:$("speak"),reset:$("reset")};
function build(){const by=new Map(RAW.map(([r,f,e,n])=>[f,{roman:r,fa:f,en:e,rank:n}])),used=new Set(),a=[];for(const s of PATH)for(const [f,r,e] of s.cards){if(used.has(f))continue;const b=by.get(f);a.push({roman:r,fa:f,en:e,rank:b?.rank??9999,stage:s.name});used.add(f)}for(const [r,f,e,n] of RAW)if(!used.has(f)){a.push({roman:r,fa:f,en:e,rank:n,stage:"Common Words"});used.add(f)}return a.slice(0,TOTAL)}
const D=build();let K=new Set(),miss={},Q=[],i=0,flipped=false,down=false,start=0,dx=0,last=null,voice=null;const audioEl=new Audio();audioEl.preload="auto";
function json(s,d){try{return JSON.parse(s)||d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify({known:[...K],miss}))}
function load(){const v=json(localStorage.getItem(KEY),null);if(v?.known){K=new Set(v.known);miss=v.miss||{};return}let o=null;for(const k of OLD){o=json(localStorage.getItem(k),null);if(o)break}if(Array.isArray(o))for(const id of o){const f=OLD_D[id-1]?.[1];if(f)K.add(f)}else if(o?.known){for(const id of o.known){const f=OLD_D[id-1]?.[1];if(f)K.add(f)}for(const [id,n] of Object.entries(o.miss||{})){const f=OLD_D[+id-1]?.[1];if(f)miss[f]=n}}}
function shuffle(a){for(let n=a.length-1;n;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
function makeDeck(){const u=D.filter(c=>!K.has(c.fa));Q=[];for(let p=0;p<u.length;){const s=u[p].stage,g=[];while(p<u.length&&u[p].stage===s)g.push(u[p++]);for(let n=0;n<g.length;n+=24)Q.push(...shuffle(g.slice(n,n+24)))}for(const c of Q.filter(c=>(miss[c.fa]||0)>0)){for(let r=0;r<Math.min(miss[c.fa],2);r++){const at=Q.findIndex(x=>x.fa===c.fa)+8+Math.floor(Math.random()*25);Q.splice(Math.min(at,Q.length),0,c)}}i=0}
function cur(){return Q[i]}function stopAudio(){audioEl.pause();audioEl.currentTime=0;E.speak.classList.remove("playing");if("speechSynthesis"in window)speechSynthesis.cancel()}function render(){if(!Q.length){makeDeck();if(!Q.length)return}stopAudio();const c=cur();flipped=false;E.card.classList.remove("flip");E.card.style.transform="";E.card.style.opacity=1;E.roman.textContent=c.roman;E.fa.textContent=c.fa;E.en.textContent=c.en;E.mr.textContent=c.roman;E.mf.textContent=c.fa;E.stageName.textContent=c.stage;const n=[...K].filter(f=>D.some(c=>c.fa===f)).length;E.known.textContent=n;E.leftCount.textContent=TOTAL-n;E.left.style.opacity=E.right.style.opacity=0}
function flip(){if(!Q.length)return;flipped=!flipped;E.card.classList.toggle("flip",flipped)}
function repeat(c,count){for(let n=0;n<count;n++){const gap=8+Math.floor(Math.random()*25);Q.splice(Math.min(i+gap,Q.length),0,c)}}
function grade(know){if(!Q.length)return;stopAudio();const c=cur(),f=c.fa,old=miss[f]||0;last={c,know,old};const d=know?1:-1;E.card.style.transform=`${flipped?"rotateY(180deg) ":""}translateX(${d*innerWidth}px) rotate(${d*9}deg)`;E.card.style.opacity=0;setTimeout(()=>{Q.splice(i,1);if(know){K.add(f);delete miss[f];Q=Q.filter(x=>x.fa!==f)}else{miss[f]=Math.min(old+1,4);repeat(c,1+Math.min(miss[f],2))}save();if(i>=Q.length)i=0;E.undo.classList.add("show");render()},160)}
function undo(){if(!last)return;const {c,know,old}=last;if(know)K.delete(c.fa);if(old)miss[c.fa]=old;else delete miss[c.fa];save();makeDeck();i=Math.max(0,Q.findIndex(x=>x.fa===c.fa));last=null;E.undo.classList.remove("show");render()}
function end(){if(!down)return;down=false;E.card.classList.remove("drag");const moved=Math.abs(dx)>6,t=Math.min(110,innerWidth*.22);if(dx<-t)grade(false);else if(dx>t)grade(true);else{E.card.style.transform=flipped?"rotateY(180deg)":"";E.left.style.opacity=E.right.style.opacity=0;if(!moved)flip()}dx=0}
E.stage.onpointerdown=e=>{if(e.target.closest(".speak"))return;down=true;start=e.clientX;dx=0;E.stage.setPointerCapture?.(e.pointerId);E.card.classList.add("drag")};E.stage.onpointermove=e=>{if(!down)return;dx=e.clientX-start;E.card.style.transform=`${flipped?"rotateY(180deg) ":""}translateX(${dx}px) rotate(${dx/28}deg)`;const n=Math.min(Math.abs(dx)/110,1);E.left.style.opacity=dx<0?n:0;E.right.style.opacity=dx>0?n:0};E.stage.onpointerup=end;E.stage.onpointercancel=end;
function chooseVoice(){if(!("speechSynthesis"in window))return;voice=speechSynthesis.getVoices().find(v=>/^fa/i.test(v.lang))||null}function nativeSpeak(c){if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(c.fa);u.lang="fa-IR";if(voice)u.voice=voice;u.rate=.84;speechSynthesis.speak(u)}function speak(){const c=cur();if(!c)return;stopAudio();const src=AUDIO[c.fa];if(src){audioEl.src=src;E.speak.classList.add("playing");audioEl.onended=()=>E.speak.classList.remove("playing");audioEl.onerror=()=>{E.speak.classList.remove("playing");nativeSpeak(c)};audioEl.play().catch(()=>nativeSpeak(c));}else nativeSpeak(c)}chooseVoice();if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=chooseVoice;
E.speak.onclick=e=>{e.stopPropagation();speak()};E.again.onclick=()=>grade(false);E.know.onclick=()=>grade(true);E.undo.onclick=undo;E.reset.onclick=()=>{if(confirm("Reset all progress?")){K=new Set();miss={};save();makeDeck();render()}};
document.onkeydown=e=>{if(["Space","Enter","ArrowUp","ArrowDown"].includes(e.code)||["Enter","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();flip()}else if(e.key==="ArrowLeft"){e.preventDefault();grade(false)}else if(e.key==="ArrowRight"){e.preventDefault();grade(true)}else if(e.key.toLowerCase()==="a"&&!e.metaKey&&!e.ctrlKey){e.preventDefault();speak()}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}};
load();const words=new Set(D.map(c=>c.fa));K=new Set([...K].filter(f=>words.has(f)));miss=Object.fromEntries(Object.entries(miss).filter(([f])=>words.has(f)));save();makeDeck();render();
</script></body></html>
