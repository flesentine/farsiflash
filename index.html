<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ee"><title>Farsi 2000</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f3ee;color:#171717;overflow:hidden;user-select:none}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(16px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}header{height:38px;display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.06em;color:#77736b}button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}#reset{padding:8px}.progress{font-variant-numeric:tabular-nums}main{display:grid;place-items:center;min-height:0}.stage{width:min(88vw,480px);height:min(66dvh,590px);perspective:1200px;position:relative;touch-action:none}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .28s cubic-bezier(.2,.75,.25,1),opacity .16s;cursor:pointer;outline:none}.card.flip{transform:rotateY(180deg)}.card.drag{transition:none}.card:focus-visible{box-shadow:0 0 0 3px #0002;border-radius:28px}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;border-radius:28px;background:#fff;box-shadow:0 14px 50px #2a241919,0 1px 2px #2a241914;backface-visibility:hidden;text-align:center}.back{transform:rotateY(180deg)}.roman,.english{font-size:clamp(40px,10vw,68px);line-height:1.05;font-weight:700;letter-spacing:-.035em;overflow-wrap:anywhere}.farsi{margin-top:22px;font-family:Tahoma,"Geeza Pro",sans-serif;font-size:clamp(34px,9vw,58px);line-height:1.35;direction:rtl;color:#5e5a53}.mini{position:absolute;bottom:28px;left:28px;right:28px;color:#8b877f;font-size:17px;line-height:1.45}.hint{position:absolute;top:22px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#aaa59c}.sw{position:absolute;top:50%;transform:translateY(-50%);z-index:5;pointer-events:none;opacity:0;font-size:12px;font-weight:800;letter-spacing:.12em}.sw.left{right:18px}.sw.right{left:18px}.actions{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}.grade{min-height:48px;padding:0 14px;border-radius:14px;font-size:13px;color:#77736b;transition:background .12s,transform .08s,opacity .12s}.grade:active{transform:scale(.97)}.grade:disabled{opacity:.28;cursor:default}.grade.again{text-align:left}.grade.know{text-align:right}.undo{min-width:70px;min-height:48px;padding:0 8px;font-size:12px;color:#77736b;opacity:0;pointer-events:none;transition:opacity .14s}.undo.show{opacity:1;pointer-events:auto}.done{text-align:center}.done h1{font-size:42px;margin:0 0 8px}@media(hover:hover){.grade:not(:disabled):hover,.undo.show:hover{background:#0000000a}}@media(prefers-reduced-motion:reduce){.card,.grade,.undo{transition:none!important}}@media(prefers-color-scheme:dark){body{background:#151513;color:#f4f1e9}.face{background:#242421;box-shadow:0 14px 50px #0005}.farsi{color:#c5c0b7}header,.grade,.undo,.mini{color:#8f8b83}.card:focus-visible{box-shadow:0 0 0 3px #fff3}@media(hover:hover){.grade:not(:disabled):hover,.undo.show:hover{background:#ffffff0b}}}
</style></head><body><div class="app"><header><div class="progress"><span id="known">0</span> known · <span id="leftCount">2000</span> left</div><button id="reset" aria-label="Reset all progress">reset</button></header><main id="main"><div class="stage" id="stage"><div class="sw left" id="left">AGAIN ←</div><div class="sw right" id="right">KNOW →</div><div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Tap, Space, or Enter to reveal the answer."><section class="face"><div class="hint">tap to reveal</div><div class="roman" id="roman"></div><div class="farsi" id="fa" dir="rtl"></div></section><section class="face back"><div class="hint">meaning</div><div class="english" id="en"></div><div class="mini"><span id="mr"></span><br><span id="mf" dir="rtl"></span></div></section></div></div></main><div class="actions"><button class="grade again" id="again" disabled aria-label="Again, I do not know this word">← Again</button><button class="undo" id="undo" aria-label="Undo last answer">Undo</button><button class="grade know" id="knowBtn" disabled aria-label="Know, I know this word">Know →</button></div></div><script src="data/00.js"></script><script src="data/01.js"></script><script src="data/02.js"></script><script src="data/03.js"></script><script src="data/04.js"></script><script src="data/05.js"></script><script src="data/06.js"></script><script src="data/07.js"></script><script>
const D=(window.FARSI_CHUNKS||[]).flat(),KEY="farsi2000-v2";const $=id=>document.getElementById(id),E={main:$("main"),stage:$("stage"),card:$("card"),roman:$("roman"),fa:$("fa"),en:$("en"),mr:$("mr"),mf:$("mf"),known:$("known"),leftCount:$("leftCount"),reset:$("reset"),left:$("left"),right:$("right"),again:$("again"),knowBtn:$("knowBtn"),undo:$("undo")};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}let S=load(),K=new Set(S.known||[]),miss=S.miss||{},Q=[],i=0,flip=false,down=false,start=0,dx=0,suppress=false,last=null;
function save(){localStorage.setItem(KEY,JSON.stringify({known:[...K],miss}))}
function makeDeck(){const unseen=D.map((x,n)=>[...x,n+1]).filter(x=>!K.has(x[3]));Q=[];for(const c of unseen){Q.push(c);const m=Math.min(miss[c[3]]||0,4);for(let r=0;r<m;r++)Q.push(c)}for(let n=Q.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[Q[n],Q[j]]=[Q[j],Q[n]]}}
function setGradeEnabled(v){E.again.disabled=E.knowBtn.disabled=!v}
function render(){if(!Q.length){makeDeck();if(!Q.length){E.main.innerHTML='<div class="done"><h1>2000 ✓</h1><p>You know the whole deck.</p></div>';E.known.textContent="2000";E.leftCount.textContent="0";setGradeEnabled(false);return}}i=Math.min(i,Q.length-1);let c=Q[i];flip=false;E.card.classList.remove("flip");E.card.style.transform="";E.card.style.opacity=1;E.roman.textContent=c[0];E.fa.textContent=c[1];E.en.textContent=c[2];E.mr.textContent=c[0];E.mf.textContent=c[1];E.known.textContent=K.size;E.leftCount.textContent=2000-K.size;E.left.style.opacity=E.right.style.opacity=0;setGradeEnabled(false)}
function turn(){if(!Q.length)return;flip=!flip;E.card.classList.toggle("flip",flip);setGradeEnabled(flip)}
function pushMissedCopies(c,count){const minGap=8,maxGap=Math.min(32,Q.length);for(let n=0;n<count;n++){const gap=minGap+Math.floor(Math.random()*Math.max(1,maxGap-minGap+1));Q.splice(Math.min(i+gap,Q.length),0,c)}}
function grade(know){if(!Q.length||!flip)return;let c=Q[i],id=c[3],oldMiss=miss[id]||0;last={card:c,index:i,know,oldMiss};let dir=know?1:-1;E.card.style.transition="transform .18s ease,opacity .16s";E.card.style.transform=`translateX(${dir*innerWidth}px) rotate(${dir*9}deg)`;E.card.style.opacity=0;setTimeout(()=>{Q.splice(i,1);if(know){K.add(id);delete miss[id];Q=Q.filter(x=>x[3]!==id)}else{miss[id]=Math.min(oldMiss+1,4);pushMissedCopies(c,1+Math.min(miss[id],2))}save();if(i>=Q.length)i=0;E.undo.classList.add("show");E.card.style.transition="none";render();requestAnimationFrame(()=>E.card.style.transition="")},165)}
function undo(){if(!last)return;const {card,index,know,oldMiss}=last,id=card[3];if(know){K.delete(id);if(oldMiss)miss[id]=oldMiss;else delete miss[id]}else{miss[id]=oldMiss;Q=Q.filter((x,n)=>x[3]!==id||n<index);Q.splice(Math.min(index,Q.length),0,card)}save();makeDeck();i=Q.findIndex(x=>x[3]===id);if(i<0)i=0;last=null;E.undo.classList.remove("show");render()}
E.card.onclick=()=>{if(suppress){suppress=false;return}turn()};E.stage.onpointerdown=e=>{if(!Q.length||!flip)return;down=true;start=e.clientX;dx=0;suppress=false;E.stage.setPointerCapture?.(e.pointerId);E.card.classList.add("drag")};E.stage.onpointermove=e=>{if(!down)return;dx=e.clientX-start;if(Math.abs(dx)>6)suppress=true;let base=flip?"rotateY(180deg) ":"";E.card.style.transform=`${base} translateX(${dx}px) rotate(${dx/28}deg)`;let n=Math.min(Math.abs(dx)/110,1);E.left.style.opacity=dx<0?n:0;E.right.style.opacity=dx>0?n:0};function end(){if(!down)return;down=false;E.card.classList.remove("drag");let t=Math.min(110,innerWidth*.22);if(dx < -t)grade(false);else if(dx > t)grade(true);else{E.card.style.transform=flip?"rotateY(180deg)":"";E.left.style.opacity=E.right.style.opacity=0}dx=0}E.stage.onpointerup=end;E.stage.onpointercancel=end;E.again.onclick=()=>grade(false);E.knowBtn.onclick=()=>grade(true);E.undo.onclick=undo;document.onkeydown=e=>{if(e.code==="Space"||e.key==="Enter"){e.preventDefault();turn()}else if(e.key==="ArrowLeft"&&flip){e.preventDefault();grade(false)}else if(e.key==="ArrowRight"&&flip){e.preventDefault();grade(true)}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}};E.reset.onclick=()=>{if(confirm("Reset all progress?")){K=new Set;miss={};localStorage.removeItem(KEY);makeDeck();i=0;last=null;E.undo.classList.remove("show");render()}};makeDeck();render();
</script></body></html>
