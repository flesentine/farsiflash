name: Audition native Persian engines

on:
  push:
    paths:
      - "tools/audition_native_persian_engines.py"
      - ".github/workflows/audition-native-persian-engines.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farsi-native-engine-audition
  cancel-in-progress: true

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Persian TTS clients
        run: python -m pip install --disable-pip-version-check edge-tts gTTS
      - name: Generate pronunciation samples
        id: audition
        shell: bash
        run: |
          set +e
          python tools/audition_native_persian_engines.py 2>&1 | tee data/native-engine-audition-status.txt
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audition result
        shell: bash
        env:
          EXIT_CODE: ${{ steps.audition.outputs.exit_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/native-engine-audition-status.txt
          [ -d audio/native-voice-test ] && git add audio/native-voice-test || true
          [ -f data/native-voice-test.json ] && git add data/native-voice-test.json || true
          [ -f voice-test.html ] && git add voice-test.html || true
          if git diff --cached --quiet; then
            echo "Native engine audition already current."
            exit 0
          fi
          if [ "$EXIT_CODE" = "0" ]; then
            MSG="Create native Persian engine audition"
          else
            MSG="Record native Persian engine audition failure"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin main
