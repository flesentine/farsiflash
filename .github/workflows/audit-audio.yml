name: Audit Persian audio integrity

on:
  workflow_dispatch:
  push:
    paths:
      - "audio/natural/**"
      - "data/audio-manifest.js"
      - "data/path.js"
      - "data/miller-*.js"
      - "tools/build_natural_audio.py"
      - "tools/audit_audio.py"
      - ".github/workflows/audit-audio.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all 2000 natural pronunciations
        id: audit
        run: python tools/audit_audio.py
      - name: Record audit outcome
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ ! -f data/audio-audit.txt ]; then
            printf 'Audio integrity audit FAILED before a report could be written.\n' > data/audio-audit.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audio-audit.txt
          if git diff --cached --quiet; then
            echo "Audit result already current."
            exit 0
          fi
          if [ "$AUDIT_OUTCOME" = "success" ]; then
            MSG="Record Persian audio audit pass"
          else
            MSG="Record Persian audio audit failure"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin main
