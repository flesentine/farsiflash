name: Install generated backgrounds

on:
  push:
    paths:
      - "asset-staging/genpack.ready"
      - ".github/workflows/install-generated-backgrounds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and install generated images
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f asset-staging/genpack.ready ]; then
            echo "Generated background pack is not marked ready yet."
            exit 0
          fi

          if ! compgen -G 'asset-staging/genpack.part-*' > /dev/null; then
            echo "Ready marker exists but no generated background chunks were found."
            exit 1
          fi

          rm -rf /tmp/farsiflip-bgpack /tmp/farsiflip-generated-pack.zip /tmp/farsiflip-generated-pack.b64
          cat asset-staging/genpack.part-* > /tmp/farsiflip-generated-pack.b64
          base64 -d /tmp/farsiflip-generated-pack.b64 > /tmp/farsiflip-generated-pack.zip
          unzip -tq /tmp/farsiflip-generated-pack.zip

          mkdir -p /tmp/farsiflip-bgpack backgrounds/generated
          unzip -q /tmp/farsiflip-generated-pack.zip -d /tmp/farsiflip-bgpack

          rm -f backgrounds/generated/iran-gen-*.webp backgrounds/generated/iran-gen-*.avif
          cp /tmp/farsiflip-bgpack/iran-gen-*.avif backgrounds/generated/

          count="$(find backgrounds/generated -maxdepth 1 -name 'iran-gen-*.avif' | wc -l | tr -d ' ')"
          if [ "$count" != "10" ]; then
            echo "Expected 10 generated backgrounds, found $count."
            exit 1
          fi

          rm -f asset-staging/genpack.part-* asset-staging/genpack.ready asset-staging/farsiflip-generated-pack.zip
          printf '10\n' > backgrounds/generated/count.txt

      - name: Commit installed backgrounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d backgrounds/generated ]; then
            git add -- backgrounds/generated
          fi
          if [ -d asset-staging ]; then
            git add -- asset-staging
          fi

          if git diff --cached --quiet; then
            echo "Generated backgrounds already installed or nothing changed."
            exit 0
          fi

          git commit -m "Install 10 generated Iranian backgrounds"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
