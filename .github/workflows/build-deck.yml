name: Build static Persian deck

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_deck.py"
      - ".github/workflows/build-deck.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build 2,000-card static deck
        run: python tools/build_deck.py
      - name: Commit generated deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/miller-*.js data/miller-meta.json
          if git diff --cached --quiet; then
            echo "Deck already current."
            exit 0
          fi
          git commit -m "Generate static Miller Persian deck"
          git push
