name: Rebuild all Persian audio with Dilara

on:
  push:
    branches:
      - main
    paths:
      - "data/v5-deck.js"
      - "tools/build_natural_audio.py"
      - "tools/build_dilara_audio.py"
      - "tools/audit_audio.py"
      - ".github/workflows/build-dilara-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farsi-dilara-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian TTS client
        run: python -m pip install --disable-pip-version-check edge-tts requests
      - name: Build all v5 primary pronunciations with Microsoft Dilara fa-IR
        run: python tools/build_dilara_audio.py
      - name: Audit full v5 Persian audio set
        run: python tools/audit_audio.py
      - name: Bust browser audio-manifest cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          version = "audio-v5-" + os.environ.get("GITHUB_SHA", "local")[:10]
          s, n = re.subn(r'data/audio-manifest\.js\?v=[^"<]+', f'data/audio-manifest.js?v={version}', s, count=1)
          if n != 1:
              raise SystemExit("audio manifest cache key not found")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit verified Dilara audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/natural data/audio-manifest.js data/elevenlabs-voice.json data/audio-quality-lock.js data/audio-audit.txt index.html
          if git diff --cached --quiet; then
            echo "Dilara audio already current."
            exit 0
          fi
          git commit -m "Replace all Persian audio with Microsoft Dilara"
          git pull --rebase origin main
          git push origin main
