name: Build natural Persian audio

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Deck start index (0, 250, 500...)"
        required: true
        default: "500"
        type: string
      count:
        description: "Number of words to generate"
        required: true
        default: "250"
        type: string
  push:
    paths:
      - "tools/build_natural_audio.py"
      - ".github/workflows/build-natural-audio.yml"

permissions:
  contents: write

concurrency:
  group: farsi-natural-audio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      START_INDEX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.start_index || '500' }}
      COUNT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.count || '250' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ElevenLabs key
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Missing repository secret ELEVENLABS_API_KEY"
            echo "Add an ElevenLabs API key as the GitHub Actions repository secret ELEVENLABS_API_KEY, then rerun this workflow."
            exit 2
          fi
      - name: Install client
        run: python -m pip install --disable-pip-version-check requests
      - name: Generate natural Persian audio batch
        run: python tools/build_natural_audio.py
      - name: Preserve autoplay controls
        run: cat data/audio-ui.js >> data/audio-manifest.js
      - name: Commit audio batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/natural data/audio-manifest.js data/elevenlabs-voice.json
          if git diff --cached --quiet; then
            echo "Natural audio batch already current."
            exit 0
          fi
          git commit -m "Generate natural Persian audio batch ${START_INDEX}+${COUNT}"
          git pull --rebase origin main
          git push origin main
