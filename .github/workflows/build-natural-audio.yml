name: Build natural Persian audio

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Deck start index (0, 250, 500...)"
        required: true
        default: "1500"
        type: string
      count:
        description: "Number of words to generate"
        required: true
        default: "500"
        type: string
  push:
    paths:
      - "tools/build_natural_audio.py"
      - "tools/build_natural_audio_resilient.py"
      - "tools/audit_audio.py"
      - "data/reading-mode.js"
      - ".github/workflows/build-natural-audio.yml"

permissions:
  contents: write

concurrency:
  group: farsi-natural-audio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      START_INDEX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.start_index || '1500' }}
      COUNT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.count || '500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ElevenLabs key
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Missing repository secret ELEVENLABS_API_KEY"
            echo "Add an ElevenLabs API key as the GitHub Actions repository secret ELEVENLABS_API_KEY, then rerun this workflow."
            exit 2
          fi
      - name: Install client
        run: python -m pip install --disable-pip-version-check requests
      - name: Generate natural Persian audio batch
        id: generate
        run: python tools/build_natural_audio_resilient.py
      - name: Preserve app controls
        if: always()
        shell: bash
        run: |
          if ! grep -q 'const PREF="farsi2000-autoplay"' data/audio-manifest.js; then
            cat data/audio-ui.js >> data/audio-manifest.js
          fi
          if ! grep -q 'farsi2000-reading-mode' data/audio-manifest.js; then
            cat data/reading-mode.js >> data/audio-manifest.js
          fi
      - name: Audit all 2000 natural pronunciations
        id: audit
        if: always()
        run: python tools/audit_audio.py
      - name: Commit audio and audit result
        if: always()
        shell: bash
        env:
          GEN_OUTCOME: ${{ steps.generate.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/natural data/audio-manifest.js data/elevenlabs-voice.json data/audio-audit.txt
          if git diff --cached --quiet; then
            echo "Audio and audit result already current."
            exit 0
          fi
          if [ "$AUDIT_OUTCOME" = "success" ]; then
            MSG="Verify full Persian audio audit and reading mode"
          elif [ "$GEN_OUTCOME" = "success" ]; then
            MSG="Record Persian audio audit failure"
          else
            MSG="Save partial Persian audio and audit result"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin main
