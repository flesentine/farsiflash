name: Bundle app UI controls

on:
  push:
    branches:
      - main
    paths:
      - "data/fsrs-browser.js"
      - "data/memory-engine.js"
      - "data/grade-animation-fix.js"
      - "data/audio-ui.js"
      - "data/reading-mode.js"
      - "data/responsive-ui.js"
      - "data/background-ui.js"
      - "data/audio-quality-lock.js"
      - "data/sync-ui.js"
      - ".github/workflows/bundle-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild UI bundle in audio manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          manifest = Path("data/audio-manifest.js")
          first = manifest.read_text(encoding="utf-8").splitlines()[0]
          if not first.startswith("window.FARSI_AUDIO="):
              raise SystemExit("audio manifest does not start with FARSI_AUDIO mapping")
          chunks = [
              first.rstrip() + "\n",
              Path("data/fsrs-browser.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/audio-ui.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/memory-engine.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/grade-animation-fix.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/reading-mode.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/responsive-ui.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/background-ui.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/audio-quality-lock.js").read_text(encoding="utf-8").rstrip() + "\n",
              Path("data/sync-ui.js").read_text(encoding="utf-8").rstrip() + "\n",
          ]
          manifest.write_text("".join(chunks), encoding="utf-8")

          # Every bundle rebuild gets a fresh browser URL so Chrome cannot keep
          # an older memory/audio/UI bundle after a source update.
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          version = "ui-" + os.environ.get("GITHUB_SHA", "local")[:10]
          s, n = re.subn(r'data/audio-manifest\.js\?v=[^"<]+', f'data/audio-manifest.js?v={version}', s, count=1)
          if n != 1:
              raise SystemExit("audio manifest cache key not found in index.html")

          # The manifest is the single runtime bundle. Remove legacy standalone
          # copies so cached older modules cannot attach a second scheduler,
          # audio player, card wrapper, background controller, or sync client.
          standalone = [
              "fsrs-browser.js", "memory-engine.js", "grade-animation-fix.js",
              "reading-mode.js", "audio-ui.js", "responsive-ui.js", "background-ui.js",
              "sync-ui.js",
          ]
          for name in standalone:
              s = re.sub(r'\s*<script src="data/' + re.escape(name) + r'(?:\?v=[^"<]+)?"></script>\s*', '\n', s)
          s = re.sub(r'\n?<!-- Farsi Flip enhancement stack:[^\n]*-->\n?', '\n', s)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit bundled controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audio-manifest.js index.html
          if git diff --cached --quiet; then
            echo "UI bundle already current."
            exit 0
          fi
          git commit -m "Bundle app UI controls"
          git pull --rebase origin main
          git push origin main
