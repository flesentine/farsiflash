name: Export v5 browser deck

on:
  push:
    branches:
      - feature/v5-curriculum-foundation
    paths:
      - 'data/v5/**'
      - 'tools/lib/**'
      - 'tools/export-v5-browser-deck.mjs'
      - '.github/workflows/export-v5-browser-deck.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5-curriculum-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export canonical v5 deck
        run: node tools/export-v5-browser-deck.mjs
      - name: Commit generated browser deck
        run: |
          git add data/v5-deck.js data/v5-deck-meta.json
          if git diff --cached --quiet; then
            echo "Browser deck already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate browser-ready v5 deck"
          git push origin HEAD:feature/v5-curriculum-foundation
