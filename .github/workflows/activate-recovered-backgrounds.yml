name: Activate recovered Iranian backgrounds

on:
  push:
    paths:
      - 'asset-staging/activate-recovered-backgrounds.ready'
      - '.github/workflows/activate-recovered-backgrounds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bust cached UI assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'data/audio-manifest\.js(?:\?v=[^"\']+)?', 'data/audio-manifest.js?v=recovered-5302', s)
          s=re.sub(r'data/background-ui\.js(?:\?v=[^"\']+)?', 'data/background-ui.js?v=recovered-5302', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Recovered background cache keys already active."
            exit 0
          fi
          git commit -m "Activate recovered Iranian backgrounds"
          git pull --rebase origin main
          git push origin main
