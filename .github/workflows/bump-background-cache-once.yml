name: Bump background cache once

on:
  push:
    paths:
      - ".github/workflows/bump-background-cache-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache keys and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('data/audio-manifest.js?v=recovered-5302','data/audio-manifest.js?v=gen10-avif1')
          s=s.replace('data/background-ui.js?v=recovered-5302','data/background-ui.js?v=gen10-avif1')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/bump-background-cache-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-background-cache-once.yml
          git commit -m "Activate generated AVIF backgrounds"
          git pull --rebase origin main
          git push origin main
