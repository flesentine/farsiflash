name: Audition native Persian voices

on:
  push:
    paths:
      - "tools/audition_persian_voice.py"
      - ".github/workflows/audition-persian-voice.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farsi-native-voice-audition
  cancel-in-progress: true

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ElevenLabs key
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::Missing repository secret ELEVENLABS_API_KEY"
            exit 2
          fi
      - name: Install client
        run: python -m pip install --disable-pip-version-check requests
      - name: Find native Persian voices and make test samples
        id: audition
        shell: bash
        run: |
          set +e
          python tools/audition_persian_voice.py 2>&1 | tee data/persian-voice-audition-status.txt
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audition outcome
        shell: bash
        env:
          EXIT_CODE: ${{ steps.audition.outputs.exit_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/persian-voice-audition-status.txt
          [ -d audio/voice-test ] && git add audio/voice-test || true
          [ -f data/persian-voice-candidates.json ] && git add data/persian-voice-candidates.json || true
          [ -f voice-test.html ] && git add voice-test.html || true
          if git diff --cached --quiet; then
            echo "Voice audition outcome already current."
            exit 0
          fi
          if [ "$EXIT_CODE" = "0" ]; then
            MSG="Create native Persian voice audition"
          else
            MSG="Record native Persian voice audition failure"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin main
