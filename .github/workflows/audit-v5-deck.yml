name: Audit v5 curriculum

on:
  push:
    branches:
      - feature/v5-curriculum-foundation
    paths:
      - 'data/v5/**'
      - 'data/miller-*.js'
      - 'tools/audit-v5-deck.mjs'
      - 'tools/audit-v5-batches.mjs'
      - 'tools/audit-v5-scoring.mjs'
      - 'tools/audit-v5-romanization.mjs'
      - 'tools/audit-v5-chunks.mjs'
      - 'tools/audit-v5-examples.mjs'
      - 'tools/audit-v5-meanings.mjs'
      - 'tools/audit-v5-modern-life.mjs'
      - 'tools/audit-v5-register.mjs'
      - 'tools/audit-v5-modernity.mjs'
      - 'tools/audit-live-v5.mjs'
      - 'data/v5-deck.js'
      - 'index.html'
      - 'data/responsive-ui.js'
      - 'tools/audit-card-text-fit.mjs'
      - 'tools/audit_v5_audio_source.py'
      - 'data/memory-engine.js'
      - 'data/sync-ui.js'
      - 'data/storage-guard.js'
      - 'data/examples-ui.js'
      - 'tools/audit-known-count.mjs'
      - 'tools/audit-v5-learning-ux.mjs'
      - 'tools/build_natural_audio.py'
      - 'tools/build_dilara_audio.py'
      - 'tools/audit_audio.py'
      - 'tools/audit-miller-source.mjs'
      - 'tools/lib/**'
      - '.github/workflows/audit-v5-deck.yml'
  pull_request:
    paths:
      - 'data/v5/**'
      - 'data/miller-*.js'
      - 'tools/audit-v5-deck.mjs'
      - 'tools/audit-v5-batches.mjs'
      - 'tools/audit-v5-scoring.mjs'
      - 'tools/audit-v5-romanization.mjs'
      - 'tools/audit-v5-chunks.mjs'
      - 'tools/audit-v5-examples.mjs'
      - 'tools/audit-v5-meanings.mjs'
      - 'tools/audit-v5-modern-life.mjs'
      - 'tools/audit-v5-register.mjs'
      - 'tools/audit-v5-modernity.mjs'
      - 'tools/audit-live-v5.mjs'
      - 'data/v5-deck.js'
      - 'index.html'
      - 'data/responsive-ui.js'
      - 'tools/audit-card-text-fit.mjs'
      - 'tools/audit_v5_audio_source.py'
      - 'data/memory-engine.js'
      - 'data/sync-ui.js'
      - 'data/storage-guard.js'
      - 'data/examples-ui.js'
      - 'tools/audit-known-count.mjs'
      - 'tools/audit-v5-learning-ux.mjs'
      - 'tools/build_natural_audio.py'
      - 'tools/build_dilara_audio.py'
      - 'tools/audit_audio.py'
      - 'tools/audit-miller-source.mjs'
      - 'tools/lib/**'
      - '.github/workflows/audit-v5-deck.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit v5 scoring policy
        run: node tools/audit-v5-scoring.mjs
      - name: Audit v5 core deck
        run: node tools/audit-v5-deck.mjs
      - name: Audit Step 18 conversational chunks
        run: node tools/audit-v5-chunks.mjs
      - name: Audit Step 19 example sentences
        run: node tools/audit-v5-examples.mjs
      - name: Audit Step 20 English meanings
        run: node tools/audit-v5-meanings.mjs
      - name: Audit Step 21 modern-life coverage
        run: node tools/audit-v5-modern-life.mjs
      - name: Audit Step 22 register
        run: node tools/audit-v5-register.mjs
      - name: Audit pre-23 modernity
        run: node tools/audit-v5-modernity.mjs
      - name: Audit v5 effective 2000-card deck
        run: node tools/audit-v5-batches.mjs
      - name: Audit live v5 wiring and migration
        run: node tools/audit-live-v5.mjs
      - name: Check responsive UI syntax
        run: node --check data/responsive-ui.js
      - name: Audit card text fitting
        run: node tools/audit-card-text-fit.mjs
      - name: Check v5 audio Python syntax
        run: python -m py_compile tools/build_natural_audio.py tools/build_dilara_audio.py tools/audit_audio.py tools/audit_v5_audio_source.py
      - name: Audit v5 audio source
        run: python tools/audit_v5_audio_source.py
      - name: Check memory and learning UI syntax
        run: node --check data/memory-engine.js && node --check data/sync-ui.js && node --check data/storage-guard.js && node --check data/examples-ui.js
      - name: Audit v5 known count
        run: node tools/audit-known-count.mjs
      - name: Audit v5 stable memory and learning UX
        run: node tools/audit-v5-learning-ux.mjs
      - name: Audit v5 learner Romanization
        run: node tools/audit-v5-romanization.mjs
      - name: Audit and normalize Miller source spellings
        run: node tools/audit-miller-source.mjs
