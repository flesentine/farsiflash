name: Build Persian audio

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_audio.py"
      - "data/path.js"
      - "data/miller-*.js"
      - ".github/workflows/build-audio.yml"

permissions:
  contents: write

concurrency:
  group: farsi-audio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TTS
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate Persian MP3s
        run: python tools/build_audio.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio data/audio-manifest.js
          if git diff --cached --quiet; then
            echo "Audio already current."
            exit 0
          fi
          git commit -m "Generate Persian pronunciation audio"
          git pull --rebase origin main
          git push origin main
