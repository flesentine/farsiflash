name: Install HQ Iranian background

on:
  push:
    paths:
      - "asset-staging/hq-background.ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install high-resolution artwork and grading fix
        shell: bash
        run: |
          mkdir -p backgrounds
          cat asset-staging/iran-sprite.part-* | base64 -d > backgrounds/iran-sprite.webp
          size=$(wc -c < backgrounds/iran-sprite.webp)
          echo "HQ sprite size: $size bytes"
          if [ "$size" -lt 500000 ]; then
            echo "Sprite is unexpectedly small" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          sprite=Path('backgrounds/iran-sprite.webp')
          b=sprite.read_bytes()
          if b[:4] != b'RIFF' or b[8:12] != b'WEBP':
              raise SystemExit('Not a valid WebP container')
          print('WebP header verified')

          bg=Path('data/background-ui.js')
          s=bg.read_text(encoding='utf-8')
          s=s.replace('backgrounds/iran-sprite.webp?v=hq1024-1','backgrounds/iran-sprite.webp?v=hq1280-1')
          s=s.replace('const TILE_W=1024,TILE_H=576,COLS=4,COUNT=14;','const TILE_W=1280,TILE_H=720,COLS=4,COUNT=14;')
          if 'TILE_W=1280,TILE_H=720' not in s:
              raise SystemExit('Could not update background tile dimensions')
          bg.write_text(s,encoding='utf-8')

          mem=Path('data/memory-engine.js')
          s=mem.read_text(encoding='utf-8')
          old='E.card.style.transition="transform .18s ease,opacity .16s";'
          new='E.card.style.transition="transform .16s ease,opacity .14s";'
          if old not in s and new not in s:
              raise SystemExit('Could not find grading transition')
          s=s.replace(old,new)
          old_timeout='        },165);\n      };'
          new_timeout='        },200);\n      };'
          if old_timeout not in s and new_timeout not in s:
              raise SystemExit('Could not find grading completion timeout')
          s=s.replace(old_timeout,new_timeout)
          mem.write_text(s,encoding='utf-8')
          print('Grading animation now finishes before the next card renders')
          PY
          rm -rf asset-staging
      - name: Commit HQ artwork and fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backgrounds/iran-sprite.webp data/background-ui.js data/memory-engine.js asset-staging
          git commit -m "Install HQ Iranian backgrounds and fix grading exit"
          git pull --rebase origin main
          git push origin main
