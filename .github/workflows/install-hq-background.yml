name: Install HQ Iranian background

on:
  push:
    paths:
      - "asset-staging/hq-background.ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native-resolution artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backgrounds
          cat asset-staging/hqn30.part-* | base64 -d > backgrounds/iran-sprite.webp
          size=$(wc -c < backgrounds/iran-sprite.webp)
          echo "Native sprite size: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "Sprite is unexpectedly small" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('backgrounds/iran-sprite.webp')
          b=p.read_bytes()
          if b[:4] != b'RIFF' or b[8:12] != b'WEBP':
              raise SystemExit('Not a valid WebP container')
          print('WebP header verified:', len(b), 'bytes')

          bg=Path('data/background-ui.js').read_text(encoding='utf-8')
          required=[
              'backgrounds/iran-sprite.webp?v=native-q30-1',
              'TILE_W=1672,TILE_H=941,COLS=4,COUNT=14',
          ]
          missing=[x for x in required if x not in bg]
          if missing:
              raise SystemExit('Background UI is not configured for native sprite: '+repr(missing))
          print('Background UI dimensions verified')
          PY
          rm -f asset-staging/hqn30.part-* asset-staging/hq-background.ready
      - name: Commit native artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backgrounds/iran-sprite.webp asset-staging
          if git diff --cached --quiet; then
            echo "Native artwork already installed."
            exit 0
          fi
          git commit -m "Install native-resolution Iranian artwork"
          git pull --rebase origin main
          git push origin main
