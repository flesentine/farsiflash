name: Install full-resolution generated backgrounds

on:
  push:
    paths:
      - "asset-staging/hq35d.ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and install 1672px backgrounds
        shell: bash
        run: |
          set -euo pipefail
          test -f asset-staging/hq35d.ready
          count_parts="$(find asset-staging -maxdepth 1 -name 'hq35d.part-*' | wc -l | tr -d ' ')"
          test "$count_parts" = "10"
          cat asset-staging/hq35d.part-* > /tmp/farsiflip-hq35d.b64
          base64 -d /tmp/farsiflip-hq35d.b64 > /tmp/farsiflip-hq35d.zip
          echo '75508932fa45308c32c60d0fc73d15e69ef17e067d75a27b794e910f8a11c9e2  /tmp/farsiflip-hq35d.zip' | sha256sum -c -
          unzip -tq /tmp/farsiflip-hq35d.zip
          rm -rf /tmp/farsiflip-hq35d
          mkdir -p /tmp/farsiflip-hq35d backgrounds/generated
          unzip -q /tmp/farsiflip-hq35d.zip -d /tmp/farsiflip-hq35d
          count="$(find /tmp/farsiflip-hq35d -maxdepth 1 -name 'iran-gen-*.avif' | wc -l | tr -d ' ')"
          test "$count" = "10"
          for f in /tmp/farsiflip-hq35d/iran-gen-*.avif; do
            size="$(wc -c < "$f")"
            test "$size" -gt 15000
          done
          rm -f backgrounds/generated/iran-gen-*.avif
          cp /tmp/farsiflip-hq35d/iran-gen-*.avif backgrounds/generated/
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/background-ui.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'const VERSION="gen10-[^"]+";', 'const VERSION="gen10-hq35d";', s, count=1)
          if n != 1: raise SystemExit('background version bump failed')
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'data/background-ui\.js\?v=[^"<]+','data/background-ui.js?v=gen10-hq35d',s)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f asset-staging/hq35d.part-* asset-staging/hq35d.ready
          rm -f asset-staging/hq35c.part-* asset-staging/hq35c.ready asset-staging/hq35b.part-* asset-staging/hq35b.ready asset-staging/hq35.part-* asset-staging/hq35.ready asset-staging/hq45.part-* asset-staging/hq45.ready
      - name: Commit backgrounds and remove installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-hq-background.yml
          git add backgrounds/generated data/background-ui.js index.html asset-staging
          git commit -m "Install 1672px generated backgrounds"
          git pull --rebase origin main
          git push origin main
