name: Install HQ Iranian background

on:
  push:
    paths:
      - "asset-staging/hq-background.ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild high-resolution sprite
        shell: bash
        run: |
          mkdir -p backgrounds
          cat asset-staging/iran-sprite.part-* | base64 -d > backgrounds/iran-sprite.webp
          size=$(wc -c < backgrounds/iran-sprite.webp)
          echo "HQ sprite size: $size bytes"
          if [ "$size" -lt 500000 ]; then
            echo "Sprite is unexpectedly small" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('backgrounds/iran-sprite.webp')
          b=p.read_bytes()
          if b[:4] != b'RIFF' or b[8:12] != b'WEBP':
              raise SystemExit('Not a valid WebP container')
          print('WebP header verified')
          PY
          rm -rf asset-staging
      - name: Commit HQ artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backgrounds/iran-sprite.webp asset-staging
          git commit -m "Install high resolution Iranian backgrounds"
          git pull --rebase origin main
          git push origin main
