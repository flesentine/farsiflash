name: Install HQ generated backgrounds

on:
  push:
    paths:
      - "asset-staging/hq45.ready"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and install high-quality backgrounds
        shell: bash
        run: |
          set -euo pipefail
          test -f asset-staging/hq45.ready
          test -n "$(find asset-staging -maxdepth 1 -name 'hq45.part-*' -print -quit)"
          cat asset-staging/hq45.part-* > /tmp/farsiflip-hq45.b64
          base64 -d /tmp/farsiflip-hq45.b64 > /tmp/farsiflip-hq45.zip
          unzip -tq /tmp/farsiflip-hq45.zip
          rm -rf /tmp/farsiflip-hq45
          mkdir -p /tmp/farsiflip-hq45 backgrounds/generated
          unzip -q /tmp/farsiflip-hq45.zip -d /tmp/farsiflip-hq45
          count="$(find /tmp/farsiflip-hq45 -maxdepth 1 -name 'iran-gen-*.avif' | wc -l | tr -d ' ')"
          test "$count" = "10"
          for f in /tmp/farsiflip-hq45/iran-gen-*.avif; do
            size="$(wc -c < "$f")"
            test "$size" -gt 25000
          done
          rm -f backgrounds/generated/iran-gen-*.avif
          cp /tmp/farsiflip-hq45/iran-gen-*.avif backgrounds/generated/
          python - <<'PY'
          from pathlib import Path
          p=Path('data/background-ui.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const VERSION="gen10-hq1";','const VERSION="gen10-hq45-1";')
          s=s.replace('const VERSION="gen10-20260821";','const VERSION="gen10-hq45-1";')
          s=s.replace('const VERSION="gen10-avif1";','const VERSION="gen10-hq45-1";')
          if 'gen10-hq45-1' not in s:
              raise SystemExit('background version bump failed')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('data/audio-manifest.js?v=gen10-avif1','data/audio-manifest.js?v=gen10-hq45-1')
          s=s.replace('data/background-ui.js?v=gen10-avif1','data/background-ui.js?v=gen10-hq45-1')
          s=s.replace('data/audio-manifest.js?v=gen10-hq1','data/audio-manifest.js?v=gen10-hq45-1')
          s=s.replace('data/background-ui.js?v=gen10-hq1','data/background-ui.js?v=gen10-hq45-1')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f asset-staging/hq45.part-* asset-staging/hq45.ready
      - name: Commit HQ backgrounds and clean installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-hq-background.yml
          git add backgrounds/generated data/background-ui.js index.html asset-staging
          git commit -m "Install higher-quality generated backgrounds"
          git pull --rebase origin main
          git push origin main
