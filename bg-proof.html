<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarsiFlip background proof</title><style>html,body{margin:0;background:#111;color:#fff;font:14px system-ui}h1{padding:16px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.tile{aspect-ratio:16/9;background-image:url('backgrounds/iran-sprite.webp?v=proof-5');background-size:400% 400%;border:1px solid #555}.status{padding:0 16px 16px}</style><h1>Iranian background sprite — 14 tiles</h1><div class="status" id="status">loading image…</div><div class="grid" id="grid"></div><script>const g=document.getElementById('grid');for(let i=0;i<14;i++){const d=document.createElement('div');d.className='tile';const c=i%4,r=Math.floor(i/4);d.style.backgroundPosition=(c/3*100)+'% '+(r/3*100)+'%';d.title='tile '+(i+1);g.appendChild(d)}const im=new Image;im.onload=()=>status.textContent='loaded '+im.naturalWidth+'×'+im.naturalHeight;im.onerror=()=>status.textContent='IMAGE FAILED TO LOAD';im.src='backgrounds/iran-sprite.webp?v=proof-5';</script>
