<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarsiFlip recovered backgrounds</title><style>html,body{margin:0;background:#111;color:#fff;font:14px system-ui}h1{padding:16px 16px 6px;margin:0}.status{padding:0 16px 16px;color:#bbb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}.tile{margin:0;border:1px solid #555;background:#181818;min-height:180px}.tile img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.tile figcaption{padding:8px}</style></head><body><h1>Recovered Iranian backgrounds</h1><div class="status" id="status">checking 4 recovered images…</div><div class="grid" id="grid"></div><script>const files=['01','07','13','14'];const g=document.getElementById('grid'),status=document.getElementById('status');let ok=0,done=0;for(const n of files){const f=document.createElement('figure');f.className='tile';const img=new Image();const cap=document.createElement('figcaption');cap.textContent='iran-'+n+' — loading…';img.onload=()=>{ok++;done++;cap.textContent='iran-'+n+' — '+img.naturalWidth+'×'+img.naturalHeight;finish()};img.onerror=()=>{done++;cap.textContent='iran-'+n+' — FAILED';finish()};img.src='backgrounds/iran-'+n+'.webp?v=5302b519';f.append(img,cap);g.appendChild(f)}function finish(){status.textContent=done===files.length?(ok+' of '+files.length+' loaded'):('checking… '+done+'/'+files.length)}</script></body></html>
